<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
    {% seo title=false %}
    {% include meta.html %}

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#00aba9">
	<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell site-header__inner">
        <a href="{{ site.baseurl }}/" class="brand">
          <img class="brand__avatar" src="{{ site.baseurl }}{{ site.avatar }}" alt="" width="44" height="44" />
          <span class="brand__text">
            <span class="brand__name">{{ site.name }}</span>
            <span class="brand__tagline">{{ site.description }}</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Main">
          {% assign path = page.url %}
          <a href="{{ site.baseurl }}/" {% if path == "/" or path contains "/page" or page.layout == "post" %}aria-current="page"{% endif %}>Blog</a>
          <a href="{{ site.baseurl }}/publications/" {% if path contains "/publications" %}aria-current="page"{% endif %}>Research</a>
          <a href="{{ site.baseurl }}/search/" {% if path contains "/search" %}aria-current="page"{% endif %}>Search</a>
          <a href="{{ site.baseurl }}/about/" {% if path contains "/about" %}aria-current="page"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="main" class="shell site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <div class="site-footer__icons">{% include svg-icons.html %}</div>
        <p class="site-footer__legal">
          &copy; {{ site.time | date: "%Y" }} {{ site.author }} &middot;
          <a href="{{ site.baseurl }}/privacy/">Privacy</a>
        </p>
      </div>
    </footer>
  </body>
</html>
